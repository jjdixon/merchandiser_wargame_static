<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Merch Day War Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<header>
  <div class="gut bar">
    <div class="brand"><h1>Merch Day War Game</h1><span>Hourly merchandiser prototype · sample data</span></div>
    <div class="ctl" id="hdrSlot"></div>
    <div class="ctl">
      <label class="lbl" for="scn">Scenario</label>
      <select id="scn"></select>
    </div>
    <div class="clock">
      <span class="d" id="dow">Thu</span><span class="t" id="clk">5:00a</span>
      <button class="btn pri" id="play" aria-label="Start simulation">▶ Run</button>
      <select id="spd" aria-label="Simulation speed">
        <option value="2">2 min/s</option><option value="5">5 min/s</option><option value="10" selected>10 min/s</option><option value="30">30 min/s</option>
      </select>
      <button class="btn" id="reset">Reset day</button>
      <button class="btn" id="endDay" title="Roll today's hours into the week and start tomorrow">End day →</button>
      <button class="btn" id="newWeek" title="Start a fresh week on Monday">New week</button>
    </div>
  </div>
  <div class="inject" id="inject">
    <div class="gut row">
      <span class="lbl">Throw a curveball</span>
      <select id="evType" aria-label="Curveball"></select>
      <select id="evTarget" aria-label="Apply to"></select>
      <span id="evParams" class="ctl"></span>
      <button class="btn" id="evGo">Inject</button>
    </div>
  </div>
  <nav class="gut tabs" role="tablist" id="tabs"></nav>
</header>

<main class="gut" id="view"></main>

<!-- The findings button and form are added by src/features/findings. -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
